# jkchess.yaml: [fas-rules]
# [dada] FAS 配置：com.tencent.jkchess（金铲铲之战）
# 自走棋特征：大部分时间是准备/观战阶段，负载低且平稳；战斗阶段有特效尖峰。
# 实测（Android 17 / SM8750，2026-11-26）：大厅/观战原生 30fps，无操作时游戏自降到 15fps，对局 60fps。
# 档位必须覆盖 15/30：最低档只有 60 时 prev_gear()=None，降档分支（含原生档识别）整段跳过，
# PID 对着 33~66ms 帧时间持续抬频 → 两簇 min=max=硬件最高（实测负载 <30%、cpuss 81℃）。
# 省电思路：原生档识别把目标降到游戏自锁档，perf 随 PID 衰减；尖峰由 PID 升频响应；perf_ceil 不覆盖。
fas_rules:
  fps_gears: [15.0, 30.0, 60.0, 90.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.jkchess:
      target_fps: [15, 30, 60, 90, 120]
      fps_margin: 3.0
  perf_init: 0.40
  core_temp_threshold: 0.0
