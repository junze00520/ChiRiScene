# jkchess.yaml: [fas-rules]
# [dada] FAS 配置：com.tencent.jkchess（金铲铲之战）
# 自走棋特征：大部分时间是准备/观战阶段，负载低且平稳；战斗阶段有特效尖峰。
# 省电思路：锁目标帧档（60/120），起始性能低于 MOBA，尖峰由 PID 升频响应；perf_ceil 不覆盖。
fas_rules:
  fps_gears: [30.0, 60.0, 90.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.jkchess:
      target_fps: [60, 90, 120]
      fps_margin: 3.0
  perf_init: 0.40
  core_temp_threshold: 0.0
